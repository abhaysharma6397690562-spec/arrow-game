name: Generate Play Store AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Extract Project Zip
        run: |
          unzip -o "arrow-out---50+-levels.zip"
          rm -f "arrow-out---50+-levels.zip"

      # --- YEH NAYA STEP ADD KAREIN ---
      - name: Fix Package Name to com.app.arrowout
        run: |
          # build.gradle aur AndroidManifest me package name aur applicationId replace karna
          find . -type f \( -name "build.gradle" -o -name "build.gradle.kts" -o -name "AndroidManifest.xml" \) -exec sed -i -E 's/applicationId[[:space:]]+["'\''].*["'\'']/applicationId "com.app.arrowout"/g' {} +
          find . -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i -E 's/namespace[[:space:]]+["'\''].*["'\'']/namespace = "com.app.arrowout"/g' {} +
          echo "Package name updated to com.app.arrowout"
      # ---------------------------------

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Create Keystore
        run: |
          keytool -genkey -v -keystore my-upload-key.jks -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass abhay12345 -keypass abhay12345 -dname "CN=Abhay, OU=Mobile, O=Apps, L=Narora, ST=UP, C=IN"

      - name: Build Signed Release AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: abhay12345
          KEY_PASSWORD: abhay12345
        run: gradle bundleRelease --no-daemon --stacktrace

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: ArrowOut-Release-AAB
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Upload Keystore Backup
        uses: actions/upload-artifact@v4
        with:
          name: Key-Backup
          path: my-upload-key.jks
          
